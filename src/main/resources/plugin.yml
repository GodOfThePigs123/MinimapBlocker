name: MinimapBlocker
version: '1.0.0'
main: dev.minimapblocker.MinimapBlocker
api-version: '1.21'
description: Tells minimap mods to disable themselves and kicks clients that register known minimap-mod channels.
commands:
  minimapblocker:
    description: Reload, resend codes, or inspect a player's client channels.
    usage: /<command> <reload|resend [player]|channels <player>>
    aliases: [mmb]
    permission: minimapblocker.admin
permissions:
  minimapblocker.admin:
    description: Allows /minimapblocker
    default: op
  minimapblocker.bypass:
    description: Exempt from disable codes and from channel-based kicks
    default: op
